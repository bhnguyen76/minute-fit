name: Backend CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'   
      # Only trigger on backend changes in PRs
  push:
    branches: [main]
    paths:
      - 'apps/api/**'   
      # Only trigger deploy when backend changes are merged

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    # Runs on both PRs and pushes to main
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        run: |
          cd apps/api
          pytest

  deploy:
    name: Deploy to Google Cloud
    runs-on: ubuntu-latest
    needs: test                          
    # Only runs if tests pass
    if: github.event_name == 'push'      
    # Only runs on merge to main, not on PRs
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.GCP_SERVICE_NAME }} \
            --source apps/api \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }}